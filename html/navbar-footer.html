<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NAVIGATION BAR AND FOOTER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="vybe-store/css/style.css"> <!-- HREF TO BE CHANGED ON GITHUB PAGE,-->
  </head>
  <body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar md:navbar-expand bg-primary">
      <div class="container">
        <a class="navbar-brand site-brand" href="#"><h2 class="site-tagline">Wear Your Vibe.</h2></a>
        <button class="btn-icon navbar-toggler" data-bs-theme="dark" type="button"
                data-bs-toggle="drawer" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" data-bs-theme="dark" aria-labelledby="mainNavLabel">
          <div class="drawer-header">
            <h3 class="drawer-title" id="mainNavLabel">Menu</h3>
            <button type="button" class="btn-close" data-bs-theme="dark" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav md:ms-auto">
              <li class="nav-item md:mx-5"><a class="nav-link site-nav-link active" aria-current="page" href="#">Home</a></li>
              <li class="nav-item md:mx-5"><a class="nav-link site-nav-link" href="#shop">Shop</a></li>
              <li class="nav-item md:mx-5"><a class="nav-link site-nav-link" href="#about">About</a></li>
              <li class="nav-item md:ms-5"><a class="nav-link site-nav-link" href="#contact">Contact</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>


    <!-- FOOTER -->
    <footer class="py-7 mt-auto site-footer " id="contact">
      <div class="container d-flex flex-column gap-2 text-center">
        <span class="">&copy; Vybe 2026 • <a class="footer-links" href="#privacy">Privacy</a> </span>
      </div>
    </footer>

    <!-- Bootstrap JavaScript (makes the mobile menu work) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
