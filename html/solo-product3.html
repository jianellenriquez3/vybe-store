<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plain Gray Tee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/product-page-order.js" defer></script>
  </head>
  <body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar md:navbar-expand bg-primary">
      <div class="container">
        <a class="navbar-brand site-brand" href="#"><h2 class="site-tagline">Wear Your Vibe.</h2></a>
        <button class="btn-icon navbar-toggler" data-bs-theme="dark" type="button"
                data-bs-toggle="drawer" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" data-bs-theme="dark" aria-labelledby="mainNavLabel">
          <div class="drawer-header">
            <h3 class="drawer-title" id="mainNavLabel">Menu</h3>
            <button type="button" class="btn-close" data-bs-theme="dark" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav md:ms-auto">
              <li class="nav-item md:mx-5"><a class="nav-link site-nav-link" href="#">Home</a></li>
              <li class="nav-item md:mx-5"><a class="nav-link site-nav-link active" aria-current="page" href="#shop">Shop</a></li>
              <li class="nav-item md:mx-5"><a class="nav-link site-nav-link" href="#about">About</a></li>
              <li class="nav-item md:ms-5"><a class="nav-link site-nav-link" href="#contact">Contact</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <!-- SOLO PRODUCT PAGE -->
    <main class="flex-grow-1 d-flex align-items-center">
      <section class="page-section w-100">
        <div class="container">
          <div class="row justify-content-center">
            <section class="lg:col-9 border border-dark p-0 product-panel" aria-labelledby="product-title">
              <a class="product-back-button" href="navbar-footer.html#" aria-label="Back to home">&larr;</a>
              <div class="row product-page-layout g-0">
                
                <!-- PRODUCT IMAGE PLACEHOLDER -->
                <div class="lg:col-5 d-flex align-self-stretch">
                  <div class="product-image">
                    <strong>LOGO</strong>
                    <strong class="text-center">SHIRT 3<br>IMAGE</strong>
                    <div>
                      <strong>Plain Gray Tee</strong>
                      <p class="product-price">₱499</p>
                      <p class="product-description">Same comfort.<br>More possibilities.</p>
                    </div>
                  </div>
                </div>

                <!-- PRODUCT INFORMATION & ORDERING INTERFACE -->
                <div class="lg:col-7 product-information d-flex flex-column justify-content-between p-4 align-self-stretch">
                  <header>
                    <h1 id="product-title">Plain Gray Tee</h1>
                    <p class="product-price">₱499</p>
                    <p class="product-description">Same comfort.<br>More possibilities.</p>
                  </header>

                  <form id="productOrderForm" class="d-flex flex-column gap-4" action="#" method="post">
                    <fieldset class="product-control-row">
                      <legend>Size</legend>
                      <div class="product-size-options" role="group" aria-label="Choose a size">
                        <button class="vybe-size-option" type="button" aria-pressed="false">XS</button>
                        <button class="vybe-size-option" type="button" aria-pressed="false">S</button>
                        <button class="vybe-size-option" type="button" aria-pressed="false">M</button>
                        <button class="vybe-size-option" type="button" aria-pressed="false">L</button>
                        <button class="vybe-size-option" type="button" aria-pressed="false">XL</button>
                      </div>
                    </fieldset>
                    <p id="orderStatus" role="status" hidden></p>

                    <div class="product-control-row">
                      <span id="quantity-label">Qty.</span>
                      <div class="product-quantity" aria-labelledby="quantity-label">
                        <button class="vybe-quantity-button" type="button" aria-label="Decrease quantity">−</button>
                        <output aria-live="polite">1</output>
                        <button class="vybe-quantity-button" type="button" aria-label="Increase quantity">+</button>
                      </div>
                    </div>

                    <button class="vybe-button vybe-button-primary align-self-center" type="submit">Order Now</button>
                  </form>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="py-7 mt-auto site-footer " id="contact">
      <div class="container d-flex flex-column gap-2 text-center">
        <span class="">&copy; Vybe 2026 • <a class="footer-links" href="#privacy">Privacy</a> </span>
      </div>
    </footer>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
